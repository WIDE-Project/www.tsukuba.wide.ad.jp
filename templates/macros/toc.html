{% macro render(items) %}
  <ul class="page-toc-list">
    {% for item in items %}
      <li>
        <a href="{{ item.permalink | safe }}">{{ item.title }}</a>
        {% if item.children %}
          {{ self::render(items=item.children) }}
        {% endif %}
      </li>
    {% endfor %}
  </ul>
{% endmacro render %}
